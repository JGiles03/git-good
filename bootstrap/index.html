<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Project</title>
    <!--bootstrap css link-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Header-->
    <div class="first-div text-center p-4">
        <h1>My First Bootstrap Page</h1>
    </div>

    <!--Content-->
    <div class="container mt-4">

        <div class="row">

            <!--column widths add to 12 (at most)-->
            <div class="col-md-6">
                <div class="p-3 bg-light border">
                    <h3>Left Section</h3>
                </div>
            </div>

            <div class="col-md-6">
                <div class="p-3 bg-light border text-end">
                    <h3>Right Section</h3>
                </div>
            </div>

        </div>

    </div>

    <div class="container mt-4">

        <div class="row">

            <div class="col-md-4">
                <div class="p-3 bg-light border text-center">
                    <h3>Left Section</h3>
                </div>
            </div>

            <div class="col-md-4">
                <div class="p-3 bg-light border text-center">
                    <h3>Center Section</h3>
                </div>
            </div>

            <div class="col-md-4">
                <div class="p-3 bg-light border text-center">
                    <h3>Right Section</h3>
                </div>
            </div>

        </div>

    </div>
    
    <!--Footer-->
    <div class="bg-dark text-white text-center p-3 mt-4">
        <p>Footer Section</p>
    </div>
</body>
</html>
